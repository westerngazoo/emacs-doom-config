[gaps]
inner.horizontal = 3
inner.vertical   = 3
outer.left       = 3
outer.right      = 3
outer.top        = 3
outer.bottom     = 3

[mode.main.binding]
# Focus between windows
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows around
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Move focused window to other monitor
alt-shift-tab = 'move-node-to-monitor next'

# Switch focus to other monitor
ctrl-alt-left  = 'focus-monitor prev'
ctrl-alt-right = 'focus-monitor next'

# Resize
alt-minus   = 'resize smart -50'
alt-equal   = 'resize smart +50'
alt-shift-0 = 'balance-sizes'

# Fullscreen
alt-f = 'fullscreen'

# Restore C32 layout
alt-shift-9 = 'exec-and-forget bash ~/.config/aerospace/restore-c32.sh'

# Reload
alt-shift-r = 'reload-config'
