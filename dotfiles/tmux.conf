# prefix: Ctrl+a (easier than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# split with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# mouse support
set -g mouse on

# 256 colors + true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# start windows from 1 not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# status bar — minimal, matches warm-paper palette
set -g status-style "bg=#efece2,fg=#1a1a1a"
set -g status-left "#[fg=#1f6feb,bold] #S  "
set -g status-right "#[fg=#9a978c] %H:%M "
set -g window-status-current-style "fg=#1f6feb,bold"
set -g message-style "bg=#dde6f3,fg=#1a1a1a"

# no delay on escape
set -sg escape-time 0
